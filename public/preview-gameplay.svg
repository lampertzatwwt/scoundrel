<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Top HUD: Health Wheel (top-left) -->
  <g transform="translate(80, 60)">
    <!-- Health wheel background -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1a1a2a" stroke-width="5"/>
    <!-- Health wheel fill (70%) -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#c9a84c" stroke-width="5" 
            stroke-dasharray="198 283" stroke-linecap="round" transform="rotate(-90)"/>
    <!-- Health text -->
    <text x="0" y="-5" font-family="Cinzel, serif" font-size="32" font-weight="900" 
          fill="#e8e4dc" text-anchor="middle">14</text>
    <text x="0" y="15" font-family="Cinzel, serif" font-size="10" font-weight="700" 
          fill="#7a7680" text-anchor="middle" letter-spacing="2">HP</text>
  </g>
  
  <!-- Weapon Info (below health) -->
  <g transform="translate(80, 150)">
    <rect x="-35" y="-20" width="70" height="40" rx="6" fill="rgba(19,19,26,0.85)" 
          stroke="#2a2a3a" stroke-width="1"/>
    <text x="0" y="-8" font-family="Cinzel, serif" font-size="9" font-weight="700" 
          fill="#7a7680" text-anchor="middle" letter-spacing="1">WEAPON</text>
    <text x="0" y="12" font-family="Cinzel, serif" font-size="14" font-weight="700" 
          fill="#4a7ec4" text-anchor="middle">K♦</text>
  </g>
  
  <!-- Deck Count (top-right) -->
  <g transform="translate(1120, 60)">
    <rect x="-40" y="-20" width="80" height="40" rx="6" fill="rgba(19,19,26,0.85)" 
          stroke="#2a2a3a" stroke-width="1"/>
    <text x="0" y="-8" font-family="Cinzel, serif" font-size="9" font-weight="700" 
          fill="#7a7680" text-anchor="middle" letter-spacing="1">DECK</text>
    <text x="0" y="12" font-family="Cinzel, serif" font-size="18" font-weight="700" 
          fill="#7a7680" text-anchor="middle">23</text>
  </g>
  
  <!-- Help Button (top-right, before deck) -->
  <g transform="translate(1050, 60)">
    <circle cx="0" cy="0" r="17" fill="rgba(19,19,26,0.85)" stroke="#2a2a3a" stroke-width="1.5"/>
    <text x="0" y="6" font-family="Cinzel, serif" font-size="18" font-weight="700" 
          fill="#8a7233" text-anchor="middle">?</text>
  </g>
  
  <!-- Room Label (center-top) -->
  <g transform="translate(600, 60)">
    <text x="0" y="0" font-family="Cinzel, serif" font-size="12" font-weight="700" 
          fill="#7a7680" text-anchor="middle" letter-spacing="2">ROOM 8 / 11</text>
  </g>
  
  <!-- Flee Button (center-top, right of room label) -->
  <g transform="translate(720, 60)">
    <rect x="-35" y="-12" width="70" height="24" rx="4" fill="rgba(19,19,26,0.85)" 
          stroke="#2a2a3a" stroke-width="1.5"/>
    <text x="0" y="4" font-family="Cinzel, serif" font-size="10" font-weight="700" 
          fill="#7a7680" text-anchor="middle" letter-spacing="1">FLEE</text>
  </g>
  
  <!-- Central 3D Card Area (visual representation) -->
  <g transform="translate(600, 400)">
    <!-- Back card (blurred) -->
    <g transform="translate(-120, -80) rotate(-15)">
      <rect x="0" y="0" width="100" height="140" rx="8" fill="#1c1c28" stroke="#2a2a3a" stroke-width="2" opacity="0.4"/>
      <text x="50" y="75" font-family="Cinzel, serif" font-size="24" font-weight="900" 
            fill="#7a7680" text-anchor="middle" opacity="0.3">♠</text>
    </g>
    
    <!-- Left card -->
    <g transform="translate(-60, -40) rotate(-8)">
      <rect x="0" y="0" width="100" height="140" rx="8" fill="#1c1c28" stroke="#2a2a3a" stroke-width="2"/>
      <text x="50" y="20" font-family="Cinzel, serif" font-size="14" font-weight="700" 
            fill="#c44040" text-anchor="middle">9♣</text>
      <text x="50" y="75" font-family="Cinzel, serif" font-size="48" font-weight="900" 
            fill="#c44040" text-anchor="middle">9</text>
      <text x="50" y="130" font-family="Cinzel, serif" font-size="14" font-weight="700" 
            fill="#c44040" text-anchor="middle">♣</text>
    </g>
    
    <!-- Center card (highlighted) -->
    <g transform="translate(0, 0)" filter="url(#goldGlow)">
      <rect x="-50" y="-70" width="100" height="140" rx="8" fill="#1c1c28" stroke="#c9a84c" stroke-width="3"/>
      <text x="0" y="-50" font-family="Cinzel, serif" font-size="16" font-weight="700" 
            fill="#c9a84c" text-anchor="middle">K♦</text>
      <text x="0" y="20" font-family="Cinzel, serif" font-size="56" font-weight="900" 
            fill="#c9a84c" text-anchor="middle">K</text>
      <text x="0" y="65" font-family="Cinzel, serif" font-size="16" font-weight="700" 
            fill="#c9a84c" text-anchor="middle">♦</text>
    </g>
    
    <!-- Right card -->
    <g transform="translate(60, -40) rotate(8)">
      <rect x="0" y="0" width="100" height="140" rx="8" fill="#1c1c28" stroke="#2a2a3a" stroke-width="2"/>
      <text x="50" y="20" font-family="Cinzel, serif" font-size="14" font-weight="700" 
            fill="#4a9e5a" text-anchor="middle">5♥</text>
      <text x="50" y="75" font-family="Cinzel, serif" font-size="48" font-weight="900" 
            fill="#4a9e5a" text-anchor="middle">5</text>
      <text x="50" y="130" font-family="Cinzel, serif" font-size="14" font-weight="700" 
            fill="#4a9e5a" text-anchor="middle">♥</text>
    </g>
    
    <!-- Far right card (blurred) -->
    <g transform="translate(120, -80) rotate(15)">
      <rect x="0" y="0" width="100" height="140" rx="8" fill="#1c1c28" stroke="#2a2a3a" stroke-width="2" opacity="0.4"/>
      <text x="50" y="75" font-family="Cinzel, serif" font-size="24" font-weight="900" 
            fill="#7a7680" text-anchor="middle" opacity="0.3">♦</text>
    </g>
  </g>
  
  <!-- Action Buttons (bottom center) -->
  <g transform="translate(600, 680)">
    <!-- Fight Button -->
    <g transform="translate(-140, 0)">
      <rect x="-50" y="-15" width="100" height="30" rx="5" fill="rgba(19,19,26,0.85)" 
            stroke="#c44040" stroke-width="1.5"/>
      <text x="0" y="6" font-family="Cinzel, serif" font-size="12" font-weight="700" 
            fill="#c44040" text-anchor="middle" letter-spacing="1">FIGHT</text>
    </g>
    
    <!-- Equip Button -->
    <g transform="translate(0, 0)">
      <rect x="-50" y="-15" width="100" height="30" rx="5" fill="rgba(19,19,26,0.85)" 
            stroke="#4a7ec4" stroke-width="1.5"/>
      <text x="0" y="6" font-family="Cinzel, serif" font-size="12" font-weight="700" 
            fill="#4a7ec4" text-anchor="middle" letter-spacing="1">EQUIP</text>
    </g>
    
    <!-- Heal Button -->
    <g transform="translate(140, 0)">
      <rect x="-50" y="-15" width="100" height="30" rx="5" fill="rgba(19,19,26,0.85)" 
            stroke="#4a9e5a" stroke-width="1.5"/>
      <text x="0" y="6" font-family="Cinzel, serif" font-size="12" font-weight="700" 
            fill="#4a9e5a" text-anchor="middle" letter-spacing="1">HEAL</text>
    </g>
  </g>
  
  <!-- Log (bottom-left) -->
  <g transform="translate(80, 720)">
    <rect x="0" y="-40" width="280" height="80" rx="6" fill="rgba(19,19,26,0.85)" 
          stroke="#2a2a3a" stroke-width="1"/>
    <text x="10" y="-20" font-family="Crimson Text, serif" font-size="11" 
          fill="#c44040">Took 3 damage from 9♣</text>
    <text x="10" y="-5" font-family="Crimson Text, serif" font-size="11" 
          fill="#4a7ec4">Equipped K♦ (damage reduced)</text>
    <text x="10" y="10" font-family="Crimson Text, serif" font-size="11" 
          fill="#4a9e5a">Healed 5 HP</text>
    <text x="10" y="25" font-family="Crimson Text, serif" font-size="11" 
          fill="#8a7233">Room 8: 3 cards played</text>
  </g>
  
  <!-- Title overlay (faded, for context) -->
  <g transform="translate(600, 150)" opacity="0.15">
    <text x="0" y="0" font-family="Cinzel, serif" font-size="48" font-weight="900" 
          fill="#c9a84c" text-anchor="middle" letter-spacing="3">SCOUNDREL</text>
    <text x="0" y="30" font-family="Cinzel, serif" font-size="14" font-weight="400" 
          fill="#7a7680" text-anchor="middle" letter-spacing="4">DUNGEON CARD GAME</text>
  </g>
</svg>
