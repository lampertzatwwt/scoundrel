<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2a;stop-opacity:1" />
    </linearGradient>
    <filter id="defeatGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Damage effect overlay -->
  <rect width="1200" height="800" fill="rgba(196,64,64,0.08)"/>
  
  <!-- Defeat Title -->
  <g transform="translate(600, 150)" filter="url(#defeatGlow)">
    <text x="0" y="0" font-family="Cinzel, serif" font-size="80" font-weight="900" 
          fill="#c44040" text-anchor="middle" letter-spacing="4">DEFEATED</text>
  </g>
  
  <!-- Subtitle -->
  <g transform="translate(600, 240)">
    <text x="0" y="0" font-family="Cinzel, serif" font-size="20" font-weight="400" 
          fill="#7a7680" text-anchor="middle" letter-spacing="2">YOU FELL IN THE DUNGEON</text>
  </g>
  
  <!-- Stats Box -->
  <g transform="translate(600, 380)">
    <rect x="-200" y="-80" width="400" height="160" rx="8" fill="rgba(19,19,26,0.85)" 
          stroke="#2a2a3a" stroke-width="1"/>
    
    <!-- Rooms Cleared -->
    <text x="-180" y="-50" font-family="Cinzel, serif" font-size="14" font-weight="700" 
          fill="#7a7680" letter-spacing="1">ROOMS CLEARED</text>
    <text x="-180" y="-25" font-family="Cinzel, serif" font-size="32" font-weight="900" 
          fill="#c44040">6 / 11</text>
    
    <!-- Final Enemy -->
    <text x="20" y="-50" font-family="Cinzel, serif" font-size="14" font-weight="700" 
          fill="#7a7680" letter-spacing="1">DEFEATED BY</text>
    <text x="20" y="-25" font-family="Cinzel, serif" font-size="32" font-weight="900" 
          fill="#c44040">A♠</text>
    
    <!-- Cards Played -->
    <text x="-180" y="30" font-family="Cinzel, serif" font-size="14" font-weight="700" 
          fill="#7a7680" letter-spacing="1">CARDS PLAYED</text>
    <text x="-180" y="55" font-family="Cinzel, serif" font-size="32" font-weight="900" 
          fill="#c9a84c">18 / 44</text>
    
    <!-- Best Weapon -->
    <text x="20" y="30" font-family="Cinzel, serif" font-size="14" font-weight="700" 
          fill="#7a7680" letter-spacing="1">BEST WEAPON</text>
    <text x="20" y="55" font-family="Cinzel, serif" font-size="32" font-weight="900" 
          fill="#4a7ec4">10♦</text>
  </g>
  
  <!-- Try Again Button -->
  <g transform="translate(600, 600)">
    <rect x="-100" y="-25" width="200" height="50" rx="8" fill="rgba(201,168,76,0.15)" 
          stroke="#c9a84c" stroke-width="2"/>
    <text x="0" y="10" font-family="Cinzel, serif" font-size="18" font-weight="700" 
          fill="#c9a84c" text-anchor="middle" letter-spacing="2">TRY AGAIN</text>
  </g>
  
  <!-- Menu Button -->
  <g transform="translate(600, 680)">
    <rect x="-70" y="-18" width="140" height="36" rx="6" fill="transparent" 
          stroke="#7a7680" stroke-width="1.5"/>
    <text x="0" y="6" font-family="Cinzel, serif" font-size="14" font-weight="700" 
          fill="#7a7680" text-anchor="middle" letter-spacing="1">MAIN MENU</text>
  </g>
</svg>
