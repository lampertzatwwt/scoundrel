<svg viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="800" fill="url(#bgGradient)"/>
  
  <!-- Phone bezel effect -->
  <rect width="400" height="800" fill="none" stroke="#1a1a2a" stroke-width="2" rx="20"/>
  
  <!-- Top HUD: Health Wheel (top-left, smaller) -->
  <g transform="translate(35, 35)">
    <!-- Health wheel background -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#1a1a2a" stroke-width="3"/>
    <!-- Health wheel fill (70%) -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#c9a84c" stroke-width="3" 
            stroke-dasharray="110 157" stroke-linecap="round" transform="rotate(-90)"/>
    <!-- Health text -->
    <text x="0" y="-3" font-family="Cinzel, serif" font-size="16" font-weight="900" 
          fill="#e8e4dc" text-anchor="middle">14</text>
    <text x="0" y="10" font-family="Cinzel, serif" font-size="7" font-weight="700" 
          fill="#7a7680" text-anchor="middle" letter-spacing="1">HP</text>
  </g>
  
  <!-- Weapon Info (below health) -->
  <g transform="translate(35, 85)">
    <rect x="-20" y="-12" width="40" height="24" rx="4" fill="rgba(19,19,26,0.85)" 
          stroke="#2a2a3a" stroke-width="1"/>
    <text x="0" y="-4" font-family="Cinzel, serif" font-size="6" font-weight="700" 
          fill="#7a7680" text-anchor="middle" letter-spacing="0.5">WPN</text>
    <text x="0" y="8" font-family="Cinzel, serif" font-size="10" font-weight="700" 
          fill="#4a7ec4" text-anchor="middle">K♦</text>
  </g>
  
  <!-- Deck Count (top-right) -->
  <g transform="translate(365, 35)">
    <rect x="-25" y="-12" width="50" height="24" rx="4" fill="rgba(19,19,26,0.85)" 
          stroke="#2a2a3a" stroke-width="1"/>
    <text x="0" y="-4" font-family="Cinzel, serif" font-size="6" font-weight="700" 
          fill="#7a7680" text-anchor="middle" letter-spacing="0.5">DECK</text>
    <text x="0" y="8" font-family="Cinzel, serif" font-size="10" font-weight="700" 
          fill="#7a7680" text-anchor="middle">23</text>
  </g>
  
  <!-- Help Button (top-right, before deck) -->
  <g transform="translate(330, 35)">
    <circle cx="0" cy="0" r="10" fill="rgba(19,19,26,0.85)" stroke="#2a2a3a" stroke-width="1"/>
    <text x="0" y="3" font-family="Cinzel, serif" font-size="12" font-weight="700" 
          fill="#8a7233" text-anchor="middle">?</text>
  </g>
  
  <!-- Room Label -->
  <g transform="translate(200, 35)">
    <text x="0" y="0" font-family="Cinzel, serif" font-size="9" font-weight="700" 
          fill="#7a7680" text-anchor="middle" letter-spacing="1">ROOM 8/11</text>
  </g>
  
  <!-- Central Card Area (portrait orientation) -->
  <g transform="translate(200, 300)">
    <!-- Back card (blurred) -->
    <g transform="translate(0, -80) rotate(0)">
      <rect x="-35" y="-50" width="70" height="100" rx="5" fill="#1c1c28" stroke="#2a2a3a" stroke-width="1.5" opacity="0.3"/>
      <text x="0" y="15" font-family="Cinzel, serif" font-size="18" font-weight="900" 
            fill="#7a7680" text-anchor="middle" opacity="0.2">♠</text>
    </g>
    
    <!-- Left card -->
    <g transform="translate(-50, -20) rotate(-12)">
      <rect x="-35" y="-50" width="70" height="100" rx="5" fill="#1c1c28" stroke="#2a2a3a" stroke-width="1.5"/>
      <text x="0" y="-35" font-family="Cinzel, serif" font-size="10" font-weight="700" 
            fill="#c44040" text-anchor="middle">9♣</text>
      <text x="0" y="15" font-family="Cinzel, serif" font-size="32" font-weight="900" 
            fill="#c44040" text-anchor="middle">9</text>
      <text x="0" y="45" font-family="Cinzel, serif" font-size="10" font-weight="700" 
            fill="#c44040" text-anchor="middle">♣</text>
    </g>
    
    <!-- Center card (highlighted) -->
    <g transform="translate(0, 0)" filter="url(#glow)">
      <rect x="-35" y="-50" width="70" height="100" rx="5" fill="#1c1c28" stroke="#c9a84c" stroke-width="2.5"/>
      <text x="0" y="-35" font-family="Cinzel, serif" font-size="11" font-weight="700" 
            fill="#c9a84c" text-anchor="middle">K♦</text>
      <text x="0" y="15" font-family="Cinzel, serif" font-size="40" font-weight="900" 
            fill="#c9a84c" text-anchor="middle">K</text>
      <text x="0" y="45" font-family="Cinzel, serif" font-size="11" font-weight="700" 
            fill="#c9a84c" text-anchor="middle">♦</text>
    </g>
    
    <!-- Right card -->
    <g transform="translate(50, -20) rotate(12)">
      <rect x="-35" y="-50" width="70" height="100" rx="5" fill="#1c1c28" stroke="#2a2a3a" stroke-width="1.5"/>
      <text x="0" y="-35" font-family="Cinzel, serif" font-size="10" font-weight="700" 
            fill="#4a9e5a" text-anchor="middle">5♥</text>
      <text x="0" y="15" font-family="Cinzel, serif" font-size="32" font-weight="900" 
            fill="#4a9e5a" text-anchor="middle">5</text>
      <text x="0" y="45" font-family="Cinzel, serif" font-size="10" font-weight="700" 
            fill="#4a9e5a" text-anchor="middle">♥</text>
    </g>
  </g>
  
  <!-- Action Buttons (stacked vertically for mobile) -->
  <g transform="translate(200, 550)">
    <!-- Fight Button -->
    <g transform="translate(0, -50)">
      <rect x="-50" y="-12" width="100" height="24" rx="4" fill="rgba(19,19,26,0.85)" 
            stroke="#c44040" stroke-width="1.5"/>
      <text x="0" y="4" font-family="Cinzel, serif" font-size="10" font-weight="700" 
            fill="#c44040" text-anchor="middle" letter-spacing="0.5">FIGHT</text>
    </g>
    
    <!-- Equip Button -->
    <g transform="translate(0, 0)">
      <rect x="-50" y="-12" width="100" height="24" rx="4" fill="rgba(19,19,26,0.85)" 
            stroke="#4a7ec4" stroke-width="1.5"/>
      <text x="0" y="4" font-family="Cinzel, serif" font-size="10" font-weight="700" 
            fill="#4a7ec4" text-anchor="middle" letter-spacing="0.5">EQUIP</text>
    </g>
    
    <!-- Heal Button -->
    <g transform="translate(0, 50)">
      <rect x="-50" y="-12" width="100" height="24" rx="4" fill="rgba(19,19,26,0.85)" 
            stroke="#4a9e5a" stroke-width="1.5"/>
      <text x="0" y="4" font-family="Cinzel, serif" font-size="10" font-weight="700" 
            fill="#4a9e5a" text-anchor="middle" letter-spacing="0.5">HEAL</text>
    </g>
  </g>
  
  <!-- Flee Button (below actions) -->
  <g transform="translate(200, 680)">
    <rect x="-40" y="-12" width="80" height="24" rx="4" fill="rgba(19,19,26,0.85)" 
          stroke="#2a2a3a" stroke-width="1.5"/>
    <text x="0" y="4" font-family="Cinzel, serif" font-size="10" font-weight="700" 
          fill="#7a7680" text-anchor="middle" letter-spacing="0.5">FLEE</text>
  </g>
  
  <!-- Log (bottom) -->
  <g transform="translate(200, 750)">
    <rect x="-90" y="-20" width="180" height="40" rx="4" fill="rgba(19,19,26,0.85)" 
          stroke="#2a2a3a" stroke-width="1"/>
    <text x="-85" y="-8" font-family="Crimson Text, serif" font-size="8" 
          fill="#c44040">Took 3 dmg from 9♣</text>
    <text x="-85" y="4" font-family="Crimson Text, serif" font-size="8" 
          fill="#4a7ec4">Equipped K♦</text>
    <text x="-85" y="16" font-family="Crimson Text, serif" font-size="8" 
          fill="#4a9e5a">Healed 5 HP</text>
  </g>
</svg>
